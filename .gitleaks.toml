# gitleaks の設定。既定の規則に、単体テストの偽の秘密だけを除外として足す。
# 除外するのは、伏せ字や鍵の扱いを確かめるために、わざと秘密に見える値を置いているテストだけ。
[extend]
useDefault = true

[allowlist]
description = "Fake secrets in unit tests"
paths = [
  '''(^|/)test/unit/redact\.test\.ts$''',
  '''(^|/)test/unit/stt-provider\.test\.ts$''',
  '''(^|/)test/unit/telemetry\.test\.ts$''',
]
# 共有リンクの相手の画面のまとめ（workers/feedback-share/src/generated.ts）は、元のファイルの名前と sha256 の先頭を持つ。
# tokens.css の名前と16進の値が API キーに見えるため、その形だけを除外する（ファイル全体は除外しない）
regexTarget = "line"
regexes = [
  '''styles/tokens\.css": "[0-9a-f]{16}"''',
]
