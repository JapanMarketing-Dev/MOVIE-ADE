<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    ADE のアプリアイコン。src/renderer/ui/Logo.tsx と同じマーク
    （四隅のかぎ括弧＋中央の四角）を、ほぼ黒の単色の本体に白で置く。
    本体は macOS Big Sur 以降の角丸スクエアの作法（1024 の中に 824・余白約10%）。
    グラデーション・艶は使わない。書き出しは node scripts/build-icon.mjs。
  -->
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="#141414"/>
  </g>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#fff" stroke-opacity="0.12"/>

  <!-- Logo.tsx の 24 グリッドを拡大（マークの 3〜21 が本体の約56%になる倍率）-->
  <g transform="translate(206 206) scale(25.5)">
    <path d="M3 8V3h5M16 3h5v5M21 16v5h-5M8 21H3v-5" fill="none" stroke="#fafafa" stroke-width="1.3" stroke-linecap="square"/>
    <rect x="9.5" y="9.5" width="5" height="5" fill="#fafafa"/>
  </g>
</svg>
