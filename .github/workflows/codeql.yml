# CodeQL で JavaScript / TypeScript と workflow（actions）のコードを調べる。公開リポジトリなので無料。
# 結果はリポジトリの Security > Code scanning に出る。ビルドは要らない（build-mode: none）ので、依存も入れない。
# actions はコミットの SHA に固定し、コメントに版を書く（test/unit/release-policy.test.ts が確かめる）。
name: CodeQL

on:
  push:
    branches: [develop, main]
  pull_request:
  schedule:
    # 毎週月曜（新しく見つかった種類の問題を、変更が無くても拾う）
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
