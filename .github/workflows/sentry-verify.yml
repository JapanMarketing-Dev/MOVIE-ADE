# Windows / Linux の配布物で、クラッシュが Sentry に届くかを実際に落として確かめる（手で起動するときだけ）。
#
# 展開済みのアプリ（pnpm build:<os>:dev）を tools/qa/sentry-crash-verify.mjs で5回起動し、
# main と renderer の JS の例外・renderer のクラッシュ・main の未処理の例外・main のネイティブのクラッシュ（次の起動で送る）を起こす。
# 送り先は既定の DSN、environment は verification（FERRET_SENTRY_FORCE=1。production のアラートを汚さない）。
# 届いたかは、ログの最後に出るインストール ID で Sentry を引いて確かめる（このジョブは Sentry を読む鍵を持たない）。
# macOS は手元の Mac で同じスクリプトを流す（macOS のランナーは cross-platform と release だけで使う決まり）。
# 実行環境・actions の固定は cross-platform.yml と同じ。
name: Sentry crash verify

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentry-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: win
            runner: windows-latest
            app: dist/dev/win-unpacked/Ferret-Dev.exe
          - os: linux
            runner: ubuntu-24.04
            app: dist/dev/linux-unpacked/ferret-dev
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.31.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      # node-pty のビルドと、画面の無いランナーで Electron を起動するための仮想ディスプレイ
      - name: Install Linux tools
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 xvfb

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dev build (${{ matrix.os }})
        run: pnpm build:${{ matrix.os }}:dev --publish never

      - name: Crash the app and send to Sentry (Windows)
        if: matrix.os == 'win'
        env:
          APP: ${{ matrix.app }}
        run: node tools/qa/sentry-crash-verify.mjs --app "$env:APP"

      # ubuntu 24.04 は Chromium のサンドボックス（chrome-sandbox の SUID・名前空間）を使えないので外す
      - name: Crash the app and send to Sentry (Linux)
        if: matrix.os == 'linux'
        env:
          APP: ${{ matrix.app }}
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node tools/qa/sentry-crash-verify.mjs --app "$APP" --no-sandbox
