# PR の変更したパスからラベルを付ける（設定: .github/labeler.yml）。
# pull_request_target は PR を受け取る側（develop / main）の workflow で動き、フォークからの PR にもラベルを付けられる。
# そのため PR のコードは取ってこない（checkout しない）。labeler は API で変更したファイルの名前だけを見る。secrets は使わない。
name: PR labels

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-labels-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: label by changed paths
    if: github.repository == 'JapanMarketing-Dev/ferret'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: false
