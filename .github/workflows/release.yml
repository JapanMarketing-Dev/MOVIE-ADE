# リリースのビルドの確かめ（タグ v* を push したとき）。3つのOSで単体テストを流して配布物を作り、その sha256 を残す。
#
# 【署名と公開は CI でしない（security-7 [3][8]）】
#   署名の鍵（release-signing-key）を持つ処理が、タグのリポジトリの中身（scripts/release-signing.mjs など）を動かすと、
#   そのタグに入れた変更が鍵を読めてしまう。ビルドのジョブから artifact で受け取ったバイト列に署名すると、
#   artifact の受け渡しで差し替えられたものにも署名してしまう。そこで:
#   - CI は鍵も R2 のトークンも持たない。secrets を使うジョブを置かない（test/unit/release-policy.test.ts・security-7.test.ts が止める）
#   - 署名・GitHub Release の下書き・R2 への stage / promote は手元の手順だけで行う（README の Releases）。
#     scripts/build-release.sh が手元で作ったファイルを scripts/release-github.mjs が自分でハッシュして署名する
#     （受け渡しを挟まない。security-5 [8]）
#   - ここで作る配布物と SHA256SUMS は、手元のビルドと見比べるための記録（公開には使わない）
#
# 【供給網】actions はコミットの SHA に固定し、コメントに版を書く（タグは付け替えられるため）。
#
# 【費用】このワークフローは公開リポジトリ（JapanMarketing-Dev/ferret）で動かす前提。
#   公開リポジトリなら標準のランナーは無料。非公開のリポジトリで動かすと、実行時間（とくに macOS）が開発者側の費用になる。
#
# 実行環境: actions は Node 24 で動く版（checkout v7.0.1 / setup-node v7.0.0 / upload-artifact v7.0.1 / download-artifact v8.0.1 /
#   pnpm/action-setup v6.1.0）。SHA は gh api で実在を確かめたもの。
# Linux は ubuntu-latest ではなく ubuntu-24.04 に固定する。ubuntu-latest は 2026-10-19 から Ubuntu 26 に変わり、
# そこでビルドした node-pty（AppImage / deb に入る）は新しい glibc を要求して、古い Ubuntu で起動できなくなるため。
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: mac
            runner: macos-latest # arm64。x64 の dmg もここで作る
          - os: win
            runner: windows-latest
          - os: linux
            runner: ubuntu-24.04 # 固定（先頭の注記）
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.31.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux build tools
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential python3

      - name: Check the tag matches package.json
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "タグ ${GITHUB_REF_NAME} と package.json の版 ${version} が一致しません" >&2
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:unit

      # ソースマップの送信（Sentry のトークン）も手元の公開の手順で行う。CI は secrets を持たない（security-7 [3]）
      - name: Build installers
        run: pnpm dist:${{ matrix.os }}

      # 作ったジョブの中で sha256 を出す（受け渡しの後ではなく、作った場所の値。手元のビルドと見比べる記録）
      - name: Record the sha256 of the installers built here
        shell: bash
        working-directory: dist/release
        run: |
          {
            echo "### sha256 (${{ matrix.os }})"
            echo '```'
            sha256sum Ferret-* 2>/dev/null || shasum -a 256 Ferret-*
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist/release/Ferret-*.dmg
            dist/release/Ferret-*.exe
            dist/release/Ferret-*.AppImage
            dist/release/Ferret-*.deb
          if-no-files-found: error
          retention-days: 3

      # 自動更新用の zip（Squirrel.Mac が入れ替えに使う）。インストーラーとは別の artifact にして、SHA256SUMS に混ぜない
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.os == 'mac'
        with:
          name: updates-mac
          path: dist/release/Ferret-*.zip
          if-no-files-found: error
          retention-days: 3
