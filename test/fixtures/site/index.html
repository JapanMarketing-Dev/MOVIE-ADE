<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>サンプル予約サービス | トップ</title>
    <link rel="stylesheet" href="/assets/style.css" />
  </head>
  <body>
    <header class="site">
      <span class="logo">サンプル予約</span>
      <nav>
        <a href="/" class="nav-home">トップ</a>
        <a href="/pricing.html" class="nav-pricing">料金</a>
        <a href="/contact.html" class="nav-contact">お問い合わせ</a>
      </nav>
    </header>

    <main>
      <h1>予約の手間を、1画面に。</h1>
      <p class="lead">
        電話とメールで回していた予約受付を、スタッフ1人でも回せる形にまとめました。初期費用はかかりません。
      </p>
      <a href="/pricing.html" class="hero-cta">料金を見る</a>

      <h2>できること</h2>
      <div class="cards">
        <div class="card">
          <h3>Web予約</h3>
          <p>24時間受付。重複予約は自動で弾きます。</p>
        </div>
        <div class="card">
          <h3>自動リマインド</h3>
          <p>前日と当日に、お客様へ自動で連絡します。</p>
        </div>
        <div class="card">
          <h3>売上の集計</h3>
          <p>日次・月次の集計を自動で作ります。</p>
        </div>
      </div>

      <div class="notice">
        導入のご相談は<a href="/contact.html">お問い合わせ</a>から。通常2営業日以内に返信します。
      </div>

      <p class="footnote">※ 表示価格はすべて税別です。最低契約期間は3ヶ月となります。</p>
    </main>

    <footer class="site">© 2026 サンプル予約サービス</footer>
  </body>
</html>
