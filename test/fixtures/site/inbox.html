<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>サンプルメール | 受信トレイ</title>
    <link rel="stylesheet" href="/assets/style.css" />
    <!-- 内蔵ブラウザのタブの E2E（e2e/browser-tabs.spec.ts）。メールに届いた確認コードを、別のタブのページへ写す流れの代わり -->
  </head>
  <body>
    <main>
      <h1>受信トレイ</h1>
      <p>サンプル予約から確認コードが届きました。</p>
      <p>確認コード: <strong id="code">482913</strong></p>
      <button id="copy-code" type="button">コードをコピー</button>
      <p id="copy-status"></p>
      <p><a id="open-verify" href="/verify.html" target="_blank">確認ページを開く（別タブ）</a></p>
      <p><button id="open-pricing" type="button" onclick="window.open('/pricing.html')">料金を別タブで開く</button></p>
      <p><button id="open-scripted" type="button" onclick="setTimeout(() => window.open('/pricing.html?late=1'), 6000)">あとで別タブを開く</button></p>
    </main>
    <script>
      document.getElementById('copy-code').addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(document.getElementById('code').textContent)
          document.getElementById('copy-status').textContent = 'コピーしました'
        } catch (err) {
          document.getElementById('copy-status').textContent = `コピーできません: ${err && err.name}`
        }
      })
    </script>
  </body>
</html>
