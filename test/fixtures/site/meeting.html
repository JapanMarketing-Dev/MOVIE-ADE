<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>サンプル予約サービス | オンライン相談</title>
    <link rel="stylesheet" href="/assets/style.css" />
  </head>
  <body>
    <header class="site">
      <span class="logo">サンプル予約</span>
      <nav>
        <a href="/" class="nav-home">トップ</a>
        <a href="/pricing.html" class="nav-pricing">料金</a>
        <a href="/contact.html" class="nav-contact">お問い合わせ</a>
      </nav>
    </header>

    <main>
      <h1>オンライン相談</h1>
      <p class="lead">相手の声の代わりに、話し声に近い音を鳴らします（1.2秒鳴って0.8秒止まる、を繰り返す）。</p>
      <p>状態: <output id="state">停止中</output></p>
    </main>

    <script>
      // 会議アプリの相手の声の代わり。E2E（e2e/system-audio.spec.ts）が「相手の声」として録る。
      // 手元のスピーカーで鳴り続けないよう、startVoice() を呼んだときだけ鳴らす
      const state = document.getElementById('state')
      let context = null
      window.startVoice = async () => {
        if (context) return context.state
        context = new AudioContext()
        const oscillator = context.createOscillator()
        oscillator.type = 'sawtooth'
        oscillator.frequency.value = 220
        const gain = context.createGain()
        gain.gain.value = 0
        oscillator.connect(gain).connect(context.destination)
        oscillator.start()
        const begin = context.currentTime + 0.1
        for (let i = 0; i < 300; i++) {
          gain.gain.setValueAtTime(0.3, begin + i * 2)
          gain.gain.setValueAtTime(0, begin + i * 2 + 1.2)
        }
        await context.resume()
        state.textContent = context.state === 'running' ? '再生中' : '停止中'
        return context.state
      }
      window.stopVoice = async () => {
        if (context) await context.close()
        context = null
        state.textContent = '停止中'
      }
    </script>
  </body>
</html>
