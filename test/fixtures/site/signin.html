<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>サンプル予約 | ログイン</title>
    <!-- ログインのポップアップ（Google でログインなどの代わり）の E2E で開く元のページ -->
  </head>
  <body>
    <h1>ログイン</h1>
    <button id="popup-login" type="button" onclick="window.open('/signin-popup.html', 'signin', 'width=480,height=600')">別ウインドウでログイン</button>
    <button id="popup-file" type="button" onclick="window.open('file:///etc/hosts', 'bad', 'width=480,height=600')">ファイルを開く</button>
    <a id="tab-link" href="/pricing.html" target="_blank">料金（別タブ）</a>
    <p id="status">未ログイン</p>
    <script>
      window.addEventListener('message', (event) => {
        if (event.origin !== location.origin || !event.data || event.data.type !== 'signed-in') return
        document.getElementById('status').textContent = `ログイン済み: ${event.data.user}`
      })
    </script>
  </body>
</html>
