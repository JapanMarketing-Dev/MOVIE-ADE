<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>サンプル予約サービス | お問い合わせ</title>
    <link rel="stylesheet" href="/assets/style.css" />
  </head>
  <body>
    <header class="site">
      <span class="logo">サンプル予約</span>
      <nav>
        <a href="/" class="nav-home">トップ</a>
        <a href="/pricing.html" class="nav-pricing">料金</a>
        <a href="/contact.html" class="nav-contact">お問い合わせ</a>
      </nav>
    </header>

    <main>
      <h1>お問い合わせ</h1>
      <p class="lead">導入のご相談・お見積りはこちらから。通常2営業日以内に返信します。</p>

      <form class="contact" novalidate>
        <div>
          <label for="name">お名前</label>
          <input id="name" name="name" type="text" />
        </div>
        <div>
          <label for="email">メールアドレス</label>
          <input id="email" name="email" type="email" />
          <!-- 仕込み: 送信してから初めてエラーが出る。必須の印もない -->
          <p class="error" id="email-error">メールアドレスの形式が正しくありません</p>
        </div>
        <div>
          <label for="body">ご相談内容</label>
          <textarea id="body" name="body" rows="5"></textarea>
        </div>
        <div>
          <button class="plan-cta" type="submit" id="submit">送信</button>
        </div>
        <p class="notice" id="done" hidden>送信しました。ありがとうございます。</p>
      </form>

      <p class="footnote">※ お電話でのお問い合わせは平日10時〜17時のみ受け付けています。</p>
    </main>

    <footer class="site">© 2026 サンプル予約サービス</footer>

    <script>
      document.querySelector('form.contact').addEventListener('submit', (event) => {
        event.preventDefault()
        const email = document.getElementById('email')
        const error = document.getElementById('email-error')
        const ok = /.+@.+\..+/.test(email.value)
        error.classList.toggle('visible', !ok)
        document.getElementById('done').hidden = !ok
      })
    </script>
  </body>
</html>
