<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>仕様書 | 料金ページ</title>
    <!-- 設計書（Google ドキュメント・Notion などの代わり）。確認先の区分「設計書」の E2E で開く -->
    <style>
      body { margin: 0; background: #f6f7f9; color: #1f2430; font-family: system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif; line-height: 1.8; }
      article { max-width: 720px; margin: 32px auto; padding: 40px 48px; background: #fff; border: 1px solid #e5e7eb; }
      h1 { margin-top: 0; font-size: 26px; }
      h2 { margin-top: 28px; font-size: 18px; border-bottom: 1px solid #e5e7eb; }
      table { border-collapse: collapse; width: 100%; }
      th, td { padding: 6px 10px; border: 1px solid #e5e7eb; text-align: left; }
    </style>
  </head>
  <body>
    <article class="spec">
      <h1>料金ページ 仕様書</h1>
      <p class="meta">版 1.2 ・ 対象: サンプル予約</p>
      <h2>1. 目的</h2>
      <p>店舗数と予約件数で選べるプランを比べ、申し込みへ進めるようにする。</p>
      <h2>2. プラン</h2>
      <table class="spec-plans">
        <tr><th>プラン</th><th>料金</th><th>予約件数／月</th></tr>
        <tr><td>ライト</td><td>月額 980 円</td><td>100 件</td></tr>
        <tr><td>スタンダード</td><td>月額 2,980 円</td><td>1,000 件</td></tr>
        <tr><td>プロ</td><td>月額 9,800 円</td><td>無制限</td></tr>
      </table>
      <h2>3. 申し込みボタン</h2>
      <p class="spec-cta">各プランの下に「申し込む」ボタンを置く。色はブランドの青。</p>
    </article>
  </body>
</html>
