<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>サンプル予約 | 確認コード</title>
    <link rel="stylesheet" href="/assets/style.css" />
    <!-- 内蔵ブラウザのタブの E2E（e2e/browser-tabs.spec.ts）。別のタブ（inbox.html）で写したコードを貼る -->
  </head>
  <body>
    <main>
      <h1>確認コードを入力</h1>
      <form id="verify-form">
        <label>確認コード <input id="code-input" name="code" type="text" autocomplete="one-time-code" /></label>
        <button id="verify" type="submit">確認する</button>
      </form>
      <p id="result"></p>
    </main>
    <script>
      document.getElementById('verify-form').addEventListener('submit', (event) => {
        event.preventDefault()
        const code = document.getElementById('code-input').value.trim()
        document.getElementById('result').textContent = code === '482913' ? '確認しました' : 'コードが違います'
      })
    </script>
  </body>
</html>
