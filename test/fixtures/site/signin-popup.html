<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>サンプル予約 | ログインのポップアップ</title>
    <!-- ログインのポップアップ。続けると Cookie を置き、元のページ（opener）に postMessage で知らせて閉じる -->
  </head>
  <body>
    <p id="opener"></p>
    <button id="continue" type="button">acme-user で続ける</button>
    <a id="custom-scheme" href="zoommtg://zoom.us/join">外のアプリ</a>
    <script>
      document.getElementById('opener').textContent = window.opener ? 'opener あり' : 'opener なし'
      document.getElementById('continue').addEventListener('click', () => {
        document.cookie = 'fixture_session=acme-user; path=/; max-age=3600'
        window.opener.postMessage({ type: 'signed-in', user: 'acme-user' }, location.origin)
        window.close()
      })
    </script>
  </body>
</html>
