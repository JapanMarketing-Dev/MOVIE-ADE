<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>サンプル予約サービス | 予約の確認</title>
    <link rel="stylesheet" href="/assets/style.css" />
    <style>
      /* 画面いっぱいに近いモーダル（書き込みの層がこの上に来るかを確かめる） */
      #confirm { width: 70vw; height: 60vh; padding: 24px; border: 1px solid #888; }
      #confirm::backdrop { background: rgba(0, 0, 0, 0.45); }
    </style>
  </head>
  <body>
    <header class="site">
      <span class="logo">サンプル予約</span>
    </header>

    <main>
      <h1>予約の確認</h1>
      <p class="lead">「予約内容を確認」を押すと、モーダルのダイアログが開きます。</p>
      <button class="plan-cta" type="button" id="open">予約内容を確認</button>
    </main>

    <!-- 仕込み: showModal で開くダイアログ。外は inert になり、Top Layer に描かれる -->
    <dialog id="confirm" aria-labelledby="confirm-title">
      <div class="confirm-body">
        <h2 id="confirm-title">予約内容</h2>
        <p>10月12日 14:00 / 2名</p>
        <label for="memo">メモ</label>
        <input id="memo" type="text" />
        <button type="button" id="close">閉じる</button>
      </div>
    </dialog>

    <script>
      const dialog = document.getElementById('confirm')
      const body = dialog.querySelector('.confirm-body')
      document.getElementById('open').addEventListener('click', () => dialog.showModal())
      document.getElementById('close').addEventListener('click', () => dialog.close())
      // よくあるフォーカスの閉じ込め: 開いている間、中身の外へ移ったフォーカスはメモの欄へ戻す
      document.addEventListener('focusin', (event) => {
        if (dialog.open && !body.contains(event.target)) document.getElementById('memo').focus()
      })
    </script>
  </body>
</html>
