<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>サンプル予約 | ポップアップの書き込み</title>
    <!-- 録画中のログインのポップアップに書き込む E2E（e2e/popup-annotation.spec.ts）で開く元のページ。名前を変えて何枚でも開ける -->
  </head>
  <body>
    <h1>ポップアップの書き込み</h1>
    <button id="open-1" type="button" onclick="window.open('/signin-popup.html?n=1', 'signin-1', 'width=480,height=600')">ログイン 1</button>
    <button id="open-2" type="button" onclick="window.open('/signin-popup.html?n=2', 'signin-2', 'width=480,height=600')">ログイン 2</button>
    <button id="open-3" type="button" onclick="window.open('/signin-popup.html?n=3', 'signin-3', 'width=480,height=600')">ログイン 3</button>
    <button id="open-4" type="button" onclick="window.open('/signin-popup.html?n=4', 'signin-4', 'width=480,height=600')">ログイン 4</button>
    <p id="status">未ログイン</p>
    <script>
      window.addEventListener('message', (event) => {
        if (event.origin !== location.origin || !event.data || event.data.type !== 'signed-in') return
        document.getElementById('status').textContent = `ログイン済み: ${event.data.user}`
      })
    </script>
  </body>
</html>
